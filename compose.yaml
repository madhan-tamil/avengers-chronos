services:
  chronos:
    build: .
    container_name: avengers-chronos
    restart: unless-stopped

    ports:
      - "127.0.0.1:5000:5000"

    environment:
      PORT: "5000"

      SESSION_SECRET_KEY: "${SESSION_SECRET_KEY:?Set in .env}"
      RECEIPT_SIGNING_KEY: "${RECEIPT_SIGNING_KEY:?Set in .env}"
      CHRONOS_FLAG: "${CHRONOS_FLAG:?Set in .env}"

      CHRONOS_VULNERABLE_REDEMPTION: "${CHRONOS_VULNERABLE_REDEMPTION:-1}"
      CHRONOS_RACE_DELAY_SECONDS: "${CHRONOS_RACE_DELAY_SECONDS:-0.15}"
      CHRONOS_DATABASE: "/data/chronos.db"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-0}"

    volumes:
      - chronos-data:/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  chronos-data:
